version: '3.8'

services:
  pibot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        ZEROCLAW_VERSION: ${ZEROCLAW_VERSION:-0.8.5}
    image: pibot:latest
    container_name: pibot
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent ZeroClaw state, config, memory database, and session data
      - ${ZEROCLAW_DATA_DIR:-../data/zeroclaw}:/home/zeroclaw/.zeroclaw
      # Antigravity CLI credentials and authentication cache
      # Set GEMINI_DATA_DIR in .env to an explicit host path (Compose does not expand '~')
      - ${GEMINI_DATA_DIR:?Error: GEMINI_DATA_DIR must be set in .env (e.g. /home/<user>/.gemini or ../data/gemini)}:/home/zeroclaw/.gemini
      # Shared workspace for agent outputs, scripts, and project repos
      - ${WORKSPACE_DATA_DIR:-../workspaces}:/home/zeroclaw/workspaces
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/health >/dev/null && pgrep -x zeroclaw >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stdin_open: true
    tty: true
